name: CI

# main 分支推送、以 main 为目标的 PR，以及手动触发时运行。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 仅授予读取仓库内容的权限。
permissions:
  contents: read

# 同一工作流、同一 ref 的新运行取消尚未结束的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 检出后不保留 Git 认证凭据。
          persist-credentials: false

      # 使用 Temurin JDK 21，并由 setup-java 管理 Maven 缓存。
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 输出实际环境版本；Maven 版本由仓库中的 Wrapper 固定。
      - name: Verify build environment
        run: |
          java -version
          ./mvnw -version

      # 统一执行环境检查、编译、测试、Boot 打包和 Spotless 格式检查。
      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
